name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm release
        run: npm install --global npm@11.18.0 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check formatting, lint, and types
        run: npm run check
      - name: Build API and run integration tests
        run: npm run test:api
      - name: Build frontend
        run: npm run build:web
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Install Chromium for browser tests
        run: npm exec --workspace @devflow/web -- playwright install --with-deps chromium
      - name: Test desktop and mobile workflows
        run: npm run test:web
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-diagnostics
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
